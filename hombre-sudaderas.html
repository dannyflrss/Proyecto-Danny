<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sudaderas Hombre - VogueLab</title>
<style>
body{margin:0;font-family:Arial,Helvetica,sans-serif;}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:15px 40px;border-bottom:2px solid #7b0f0f22;}
.topbar img.logo{width:60px;border-radius:12px;}
nav{display:flex;gap:20px;}
nav a{text-decoration:none;font-weight:bold;color:#7b0f0f;}
.cart{width:32px;cursor:pointer;filter:invert(20%) sepia(80%) saturate(1500%) hue-rotate(330deg);}
.header-title{text-align:center;padding:20px 0;background:#7b0f0f;color:white;font-size:28px;margin-bottom:30px;}
.products{display:flex;flex-direction:row;gap:20px;overflow-x:auto;padding:0 40px 40px;}
.product{min-width:250px;background:white;border-radius:14px;box-shadow:0 0 12px #0003;text-align:center;padding-bottom:15px;}
.product img{width:100%;height:320px;object-fit:cover;border-radius:14px 14px 0 0;}
.product h3{margin:10px 0 5px;color:#7b0f0f;}
.product p{margin:0;font-weight:bold;color:#333;margin-bottom:10px;}
.add-btn{background:#7b0f0f;padding:10px 18px;color:white;border-radius:8px;border:none;cursor:pointer;font-weight:bold;}
.add-btn:hover{background:#a31212;}
#cart-popup{position:fixed;top:0;right:0;width:350px;height:100%;background:white;box-shadow:-4px 0 12px #0004;padding:20px;transition:0.3s;z-index:999;display:none;flex-direction:column;}
.close-cart{background:#7b0f0f;color:white;padding:8px 12px;border:none;border-radius:8px;cursor:pointer;margin-bottom:15px;}
.close-cart:hover{background:#a31212;}
.cart-item{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #ddd;}
.pay-btn{width:100%;margin-top:20px;padding:12px;background:#7b0f0f;color:white;border:none;border-radius:10px;font-size:16px;cursor:pointer;}
.pay-btn:hover{background:#a31212;}
</style>
</head>
<body>
<div class="topbar">
  <img class="logo" src="imgs/logo.jpg">
  <nav>
    <a href="index.html">Inicio</a>
    <a href="mujer.html">Mujer</a>
    <a href="hombre.html">Hombre</a>
  </nav>
  <img class="cart" src="https://cdn-icons-png.flaticon.com/512/34/34568.png" onclick="toggleCart()">
</div>

<div class="header-title">SUDADERAS - HOMBRE</div>

<div class="products">
  <div class="product">
    <img src="imgs/sud1.jpg">
    <h3>Sudadera Roja</h3>
    <p>$499</p>
    <button class="add-btn" onclick="addToCart('Sudadera Gris',499)">Agregar al carrito</button>
  </div>
  <div class="product">
    <img src="imgs/sud2.jpg">
    <h3>Sudadera Gris</h3>
    <p>$549</p>
    <button class="add-btn" onclick="addToCart('Sudadera Negra',549)">Agregar al carrito</button>
  </div>
  <div class="product">
    <img src="imgs/sud3.jpg">
    <h3>Sudadera Beige</h3>
    <p>$579</p>
    <button class="add-btn" onclick="addToCart('Sudadera Azul',579)">Agregar al carrito</button>
  </div>
  <div class="product">
    <img src="imgs/sud4.jpg">
    <h3>Sudadera Carros</h3>
    <p>$499</p>
    <button class="add-btn" onclick="addToCart('Sudadera Blanca',499)">Agregar al carrito</button>
  </div>
</div>

<div id="cart-popup">
  <button class="close-cart" onclick="toggleCart()">Cerrar</button>
  <h2>Carrito</h2>
  <div id="cart-items"></div>
  <h3>Total: $<span id="total">0</span></h3>
  <button class="pay-btn">Pagar</button>
</div>

<script>
let cart = [];
function addToCart(name, price){cart.push({name, price}); renderCart();}
function renderCart(){
  const container=document.getElementById('cart-items'); container.innerHTML=""; let total=0;
  cart.forEach(item=>{total+=item.price; container.innerHTML+=`<div class="cart-item"><span>${item.name}</span><span>$${item.price}</span></div>`;});
  document.getElementById("total").textContent=total;
}
function toggleCart(){
  const cartPopup=document.getElementById("cart-popup");
  cartPopup.style.display = cartPopup.style.display==="flex"?"none":"flex";
}
</script>
</body>
</html>
